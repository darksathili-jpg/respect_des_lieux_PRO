name: V5.2 Windows Professional Qualification

on:
  push:
    branches: ["main"]
    paths:
      - "package.json"
      - "main-bootstrap.cjs"
      - "main.cjs"
      - "preload.cjs"
      - "src/**"
      - "renderer/**"
      - "tests/**"
      - ".github/workflows/v52-windows-qualification.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node 24.21
        uses: actions/setup-node@v5
        with:
          node-version: "24.21.0"

      - name: Install pinned desktop toolchain
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Reliability and qualification tests
        shell: pwsh
        run: npm run verify

      - name: Build unpacked Windows runtime
        shell: pwsh
        run: npx electron-builder --win dir --x64 --publish never

      - name: Rendered UI gate
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Recurse -Filter "Respect des Lieux PRO.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "Exécutable unpacked introuvable." }
          $stdout = Join-Path $env:RUNNER_TEMP "rdl-ui-stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "rdl-ui-stderr.txt"
          $env:RDL_PACKAGED_SMOKE = "1"
          $p = Start-Process -FilePath $exe.FullName -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $finished = $p.WaitForExit(25000)
          if (-not $finished) {
            try { Stop-Process -Id $p.Id -Force } catch {}
            throw "Le contrôle de rendu UI n'a pas terminé dans le délai imparti."
          }
          $p.Refresh()
          $out = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { "" }
          $err = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "" }
          Write-Host $out
          Write-Host $err
          if ($p.ExitCode -ne 0 -or $out -notmatch 'RDL_SMOKE_PASS') {
            throw "Qualification refusée : l'interface empaquetée n'a pas fourni de preuve de rendu valide."
          }

      - name: Build x64 NSIS qualification installer
        shell: pwsh
        run: npm run dist:win

      - name: Assert installer artifact
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path dist -Filter *.exe -File
          if ($files.Count -lt 1) { throw "Aucun installateur .exe produit." }
          $files | Select-Object Name,Length,LastWriteTime | Format-Table -AutoSize

      - name: Upload unsigned qualification installer
        uses: actions/upload-artifact@v4
        with:
          name: respect-des-lieux-pro-v5.2-windows-unsigned
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish clickable GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $version = [string]$pkg.version
          $tag = "v$version"
          $title = "Respect des Lieux PRO V$version"
          $exe = Get-ChildItem -Path dist -Filter *.exe -File | Select-Object -First 1
          if (-not $exe) { throw "Installateur introuvable pour la publication." }

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title $title `
              --prerelease `
              --notes "Version de qualification Windows non signée. Utiliser uniquement des données fictives pour les essais."
          }

          gh release upload $tag $exe.FullName --repo $env:GITHUB_REPOSITORY --clobber
