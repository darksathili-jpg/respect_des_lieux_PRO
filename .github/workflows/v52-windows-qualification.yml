name: V5.2 Windows Professional Qualification

on:
  push:
    branches: ["main"]
    paths:
      - "package.json"
      - "main-entry.cjs"
      - "main-bootstrap.cjs"
      - "main.cjs"
      - "preload.cjs"
      - "src/**"
      - "renderer/**"
      - "tests/**"
      - "scripts/**"
      - "quality/**"
      - "design/reference/dashboard-master.png"
      - "design/visual/**"
      - ".github/workflows/v52-windows-qualification.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read release state
        id: release-state
        shell: pwsh
        run: |
          $state = Get-Content "quality/release-state.json" -Raw | ConvertFrom-Json
          $publish = if ($state.releaseFrozen -eq $true) { "false" } else { "true" }
          "publish=$publish" >> $env:GITHUB_OUTPUT
          Write-Host "releaseFrozen=$($state.releaseFrozen)"
          if ($state.releaseFrozen -eq $true) {
            Write-Host "RELEASE FROZEN: $($state.reason)"
            Write-Host "La qualification peut produire des preuves CI, mais aucune prerelease GitHub ne sera publiée."
          }

      - name: Node 24.21
        uses: actions/setup-node@v5
        with:
          node-version: "24.21.0"
          package-manager-cache: false

      - name: Multi-Agent Quality Gate
        shell: pwsh
        run: node scripts/quality-contract.mjs --role all

      - name: UX Architecture Guardrails
        shell: pwsh
        run: node scripts/ux-guardrails.mjs

      - name: Verify approved master identity
        shell: pwsh
        run: |
          $master = "design/reference/dashboard-master.png"
          if (-not (Test-Path $master)) { throw "Master visuel absent: $master" }
          $hash = (Get-FileHash $master -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "1106a0bcbc52d34ef6ea95f56ac999b2abc228034bd1a673023d3c761f155944"
          Write-Host "dashboard-master.png SHA-256: $hash"
          if ($hash -ne $expected) { throw "La source de vérité visuelle a changé sans validation explicite." }

      - name: Install pinned desktop toolchain
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Reliability and qualification tests
        shell: pwsh
        run: npm run verify

      - name: Build unpacked Windows runtime
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win:dir

      - name: Rendered UI smoke gate
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Recurse -Filter "Respect des Lieux PRO.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "Exécutable unpacked introuvable." }
          $stdout = Join-Path $env:RUNNER_TEMP "rdl-ui-stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "rdl-ui-stderr.txt"
          $env:RDL_PACKAGED_SMOKE = "1"
          $p = Start-Process -FilePath $exe.FullName -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $finished = $p.WaitForExit(25000)
          if (-not $finished) {
            try { Stop-Process -Id $p.Id -Force } catch {}
            throw "Le contrôle de rendu UI n'a pas terminé dans le délai imparti."
          }
          $p.Refresh()
          $out = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { "" }
          $err = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "" }
          Write-Host $out
          Write-Host $err
          if ($p.ExitCode -ne 0 -or $out -notmatch 'RDL_SMOKE_PASS') {
            throw "Qualification refusée : l'interface empaquetée n'a pas fourni de preuve de rendu valide."
          }

      - name: Install pinned Playwright fidelity harness
        shell: pwsh
        working-directory: design/visual
        run: npm install --no-audit --no-fund

      - name: Prepare immutable Electron snapshot baseline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "design/visual/electron-snapshots" | Out-Null
          Copy-Item "design/reference/dashboard-master.png" "design/visual/electron-snapshots/dashboard-master.png" -Force

      - name: Packaged Electron visual and production UX gates
        shell: pwsh
        working-directory: design/visual
        run: npx playwright test --config=playwright.electron.config.mjs

      - name: Upload Electron visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-qualification-fidelity-evidence
          path: |
            design/visual/electron-artifacts/**
            design/visual/playwright-report/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Build x64 NSIS qualification installer
        shell: pwsh
        run: npm run dist:win

      - name: Assert installer artifact
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path dist -Filter *.exe -File
          if ($files.Count -lt 1) { throw "Aucun installateur .exe produit." }
          $files | Select-Object Name,Length,LastWriteTime | Format-Table -AutoSize

      - name: Upload unsigned qualification installer
        uses: actions/upload-artifact@v4
        with:
          name: respect-des-lieux-pro-v5.2-windows-unsigned
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish clickable GitHub prerelease
        if: steps.release-state.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $version = [string]$pkg.version
          $tag = "v$version"
          $title = "Respect des Lieux PRO V$version"
          $exe = Get-ChildItem -Path dist -Filter *.exe -File | Select-Object -First 1
          if (-not $exe) { throw "Installateur introuvable pour la publication." }

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "La release $tag existe déjà : publication ignorée afin de ne jamais remplacer silencieusement un installateur déjà distribué."
            exit 0
          }

          gh release create $tag `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title $title `
            --prerelease `
            --notes "Version de qualification Windows non signée. Publication autorisée uniquement après levée explicite du gel architectural."

          gh release upload $tag $exe.FullName --repo $env:GITHUB_REPOSITORY
