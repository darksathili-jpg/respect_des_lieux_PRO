name: R3 Reparations P0 Apply

on:
  push:
    branches: ["main"]
    paths:
      - '.github/scripts/r3_reparations_p0_api.py'
      - '.github/workflows/r3-reparations-p0-apply.yml'
      - 'tests/r3-reparations-api.test.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Apply R3-P2 API foundation
        run: python .github/scripts/r3_reparations_p0_api.py
      - name: Syntax gates
        run: |
          node --check src/database.cjs
          node --check main.cjs
          node --check preload.cjs
          node --check renderer/detail.js
      - name: R3-P2 focused tests
        run: node --test tests/r3-reparations-api.test.mjs
      - name: Commit foundation
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/database.cjs main.cjs preload.cjs renderer/detail.js main-entry.cjs
          git commit -m 'R3-P2: remplace le monkey-patch par une API Réparations explicite'
          git push
