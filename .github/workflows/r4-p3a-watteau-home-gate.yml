name: R4-P3a Watteau Home Visual Gate

on:
  push:
    branches: ["r4-p3a-watteau-home"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watteau-home:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Node 24.21
        uses: actions/setup-node@v5
        with:
          node-version: "24.21.0"

      - name: Preserve architecture, R3 and R4 contracts
        shell: pwsh
        run: |
          npm run verify
          if ($LASTEXITCODE -ne 0) { throw "Le contrat global a échoué." }
          node scripts/r3-signalements-gate.mjs
          if ($LASTEXITCODE -ne 0) { throw "Le contrat R3 a régressé." }
          node scripts/r4-reparations-gate.mjs
          if ($LASTEXITCODE -ne 0) { throw "Le contrat R4 a régressé." }

      - name: Preserve exact qualified R4-P2 runtime implementation
        shell: pwsh
        run: |
          $baseline = "a20bff033452207b5b93f3af4296981bca2a308e"
          git merge-base --is-ancestor $baseline HEAD
          if ($LASTEXITCODE -ne 0) { throw "Le commit R4-P2 qualifié n'est plus un ancêtre du HEAD." }
          $critical = @(
            "src/database.cjs",
            "src/reparation-domain.cjs",
            "renderer/reparations.js",
            "renderer/reparations.css",
            "preload.cjs",
            "main.cjs",
            "tests/reparation-edit.test.mjs"
          )
          $changed = git diff --name-only "$baseline...HEAD" -- $critical
          if ($changed) {
            Write-Host "Fichiers R4-P2 runtime critiques modifiés :"
            $changed | ForEach-Object { Write-Host " - $_" }
            throw "R4-P3a n'a pas le droit de modifier le runtime R4-P2 qualifié."
          }
          Write-Host "R4-P2_RUNTIME_FILES_UNCHANGED"

      - name: Install pinned desktop toolchain
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Build true unpacked Windows application
        shell: pwsh
        run: npm run dist:win:dir

      - name: Capture true packaged Watteau Accueil
        shell: pwsh
        run: |
          $local = Join-Path $env:RUNNER_TEMP "rdl-r4-p3a-localappdata"
          $evidence = Join-Path $env:RUNNER_TEMP "rdl-r4-p3a-evidence"
          Remove-Item $local -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $evidence -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $local -Force | Out-Null
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null

          $exe = Get-ChildItem -Path dist -Recurse -Filter "Respect des Lieux PRO.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "Exécutable unpacked introuvable." }

          $env:LOCALAPPDATA = $local
          Remove-Item Env:RDL_PACKAGED_SMOKE -ErrorAction SilentlyContinue
          $stdout = Join-Path $evidence "electron-stdout.txt"
          $stderr = Join-Path $evidence "electron-stderr.txt"
          $port = 9664
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--remote-debugging-port=$port" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            node scripts/capture-packaged-ui.mjs --port $port --out $evidence
            if ($LASTEXITCODE -ne 0) { throw "Le Visual Evidence Gate R4-P3a a échoué (code $LASTEXITCODE)." }
          }
          finally {
            if ($p -and -not $p.HasExited) {
              try { Stop-Process -Id $p.Id -Force } catch {}
            }
          }

      - name: Upload Watteau visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4-p3a-watteau-home-evidence
          path: ${{ runner.temp }}/rdl-r4-p3a-evidence/**
          if-no-files-found: warn
          retention-days: 14
