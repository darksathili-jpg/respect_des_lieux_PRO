name: Watteau Hero Qualification

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hero-packaged-proof:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node 24.21
        uses: actions/setup-node@v5
        with:
          node-version: "24.21.0"

      - name: Install toolchain
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Verify isolated hero source contract
        shell: pwsh
        run: |
          @'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const heroPath = 'renderer/assets/watteau-home-hero.webp';
          const expected = '94b4c5b7b2d6709c9e76fba990416c977828473c86dbc80ffcb09eb72014a8fe';
          const hero = fs.readFileSync(heroPath);
          const digest = crypto.createHash('sha256').update(hero).digest('hex');
          const home = fs.readFileSync('renderer/home.css','utf8');
          const layout = fs.readFileSync('renderer/layout.css','utf8');
          const failures = [];
          if (digest !== expected) failures.push(`hero sha256 ${digest} != ${expected}`);
          if (!home.includes("url('./assets/watteau-home-hero.webp')")) failures.push('home.css ne référence pas le hero Watteau');
          if (home.includes('dashboard-hero-production.svg')) failures.push('ancien hero SVG encore actif');
          if (!layout.includes("url('./assets/sidebar-logo-production.svg')")) failures.push('sidebar historique modifiée pendant le jalon hero');
          if (layout.includes('watteau-sidebar')) failures.push('sidebar Watteau introduite trop tôt');
          if (failures.length) { console.error(failures.join('\n')); process.exit(71); }
          console.log(`WATTEAU_HERO_SOURCE_PASS sha256=${digest} bytes=${hero.length}`);
          '@ | node

      - name: Adapt legacy assertions inside CI workspace only
        shell: pwsh
        run: |
          @'
          const fs = require('node:fs');
          const files = [
            'scripts/quality-contract.mjs',
            'scripts/ux-guardrails.mjs',
            'main-bootstrap.cjs',
            'scripts/capture-packaged-ui.mjs',
            'tests/ui-shell.test.mjs'
          ];
          for (const file of files) {
            const original = fs.readFileSync(file, 'utf8');
            const hasLiteral = original.includes('dashboard-hero-production.svg');
            const hasEscapedRegex = original.includes('dashboard-hero-production\\.svg');
            if (!hasLiteral && !hasEscapedRegex) {
              console.error(`LEGACY_ASSERTION_NOT_FOUND ${file}`);
              process.exit(72);
            }
            let patched = original;
            patched = patched.replaceAll('dashboard-hero-production.svg', 'watteau-home-hero.webp');
            patched = patched.replaceAll('dashboard-hero-production\\.svg', 'watteau-home-hero\\.webp');
            fs.writeFileSync(file, patched, 'utf8');
            console.log(`CI_WORKSPACE_PATCHED ${file}`);
          }
          '@ | node

      - name: Verify full contracts with hero milestone assertions
        shell: pwsh
        run: npm run verify

      - name: Build unpacked Windows application
        shell: pwsh
        run: npx electron-builder --win dir --x64 --publish never

      - name: Inspect packaged ASAR hero contract
        shell: pwsh
        run: |
          @'
          const asar = require('@electron/asar');
          const path = require('node:path');
          const archive = path.resolve('dist/win-unpacked/resources/app.asar');
          const files = asar.listPackage(archive).map((p) => p.replace(/^[/\\]+/, '').replace(/\\/g, '/'));
          const required = [
            'renderer/home.css',
            'renderer/layout.css',
            'renderer/assets/watteau-home-hero.webp',
            'renderer/assets/sidebar-logo-production.svg'
          ];
          const missing = required.filter((p) => !files.includes(p));
          if (missing.length) { console.error('HERO_ASAR_MISSING ' + JSON.stringify(missing)); process.exit(72); }
          console.log('WATTEAU_HERO_ASAR_PASS');
          '@ | Set-Content -Path inspect-hero-asar.cjs -Encoding utf8
          node inspect-hero-asar.cjs

      - name: Verify real packaged shell and painted UI
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Recurse -Filter "Respect des Lieux PRO.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "Exécutable unpacked introuvable." }
          $stdout = Join-Path $env:RUNNER_TEMP "hero-smoke-stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "hero-smoke-stderr.txt"
          $env:RDL_PACKAGED_SMOKE = "1"
          $p = Start-Process -FilePath $exe.FullName -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $finished = $p.WaitForExit(25000)
          if (-not $finished) { try { Stop-Process -Id $p.Id -Force } catch {}; throw "Smoke packagé expiré." }
          $p.Refresh()
          $out = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { "" }
          $err = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "" }
          Write-Host $out
          Write-Host $err
          if ($p.ExitCode -ne 0 -or $out -notmatch 'RDL_SMOKE_PASS') { throw "Le vrai EXE n'a pas validé le smoke hero." }

      - name: Capture true packaged hero evidence
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Recurse -Filter "Respect des Lieux PRO.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "Exécutable unpacked introuvable pour la capture." }
          Remove-Item Env:RDL_PACKAGED_SMOKE -ErrorAction SilentlyContinue
          $port = 9333
          $evidence = Join-Path $env:RUNNER_TEMP "watteau-hero-evidence"
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--remote-debugging-port=$port" -PassThru
          try {
            node scripts/capture-packaged-ui.mjs --port $port --out $evidence
            if ($LASTEXITCODE -ne 0) { throw "Capture hero échouée." }
            $json = Get-Content (Join-Path $evidence 'visual-evidence.json') -Raw
            if ($json -notmatch 'watteau-home-hero\.webp') { throw "La preuve runtime ne référence pas le hero Watteau." }
            $required = @(
              (Join-Path $evidence 'home-desktop-1440x900.png'),
              (Join-Path $evidence 'home-desktop-keyboard-focus.png'),
              (Join-Path $evidence 'home-reduced-1024x720.png'),
              (Join-Path $evidence 'visual-evidence.json')
            )
            foreach ($file in $required) { if (-not (Test-Path $file)) { throw "Preuve absente: $file" } }
            Write-Host 'WATTEAU_HERO_PACKAGED_VISUAL_PASS'
          }
          finally {
            if ($p -and -not $p.HasExited) { try { Stop-Process -Id $p.Id -Force } catch {} }
          }

      - name: Upload hero qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watteau-hero-qualification-evidence
          path: |
            ${{ runner.temp }}/hero-smoke-stdout.txt
            ${{ runner.temp }}/hero-smoke-stderr.txt
            ${{ runner.temp }}/watteau-hero-evidence/**
          if-no-files-found: ignore
          retention-days: 14
