name: R3 Signalements Functional Gate

on:
  push:
    branches: ["r3-signalements"]
    paths:
      - "src/**"
      - "renderer/**"
      - "preload.cjs"
      - "main.cjs"
      - "main-entry.cjs"
      - "tests/**"
      - "scripts/r3-signalements-gate.mjs"
      - "scripts/r3-seed-packaged-e2e.cjs"
      - "scripts/r3-packaged-e2e*.mjs"
      - "scripts/r3-reparations-packaged-e2e.mjs"
      - "scripts/r4-admin-packaged-e2e.mjs"
      - "scripts/r4-admin-ux-packaged-e2e.mjs"
      - "scripts/r4-restore-restart-verify.mjs"
      - "quality/r3-signalements-contract.json"
      - "docs/R3-SIGNALEMENTS-AUDIT.md"
      - ".github/workflows/r3-signalements-functional-gate.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "renderer/**"
      - "preload.cjs"
      - "main.cjs"
      - "main-entry.cjs"
      - "tests/**"
      - "scripts/r3-signalements-gate.mjs"
      - "scripts/r3-seed-packaged-e2e.cjs"
      - "scripts/r3-packaged-e2e*.mjs"
      - "scripts/r3-reparations-packaged-e2e.mjs"
      - "scripts/r4-admin-packaged-e2e.mjs"
      - "scripts/r4-admin-ux-packaged-e2e.mjs"
      - "scripts/r4-restore-restart-verify.mjs"
      - "quality/r3-signalements-contract.json"
      - "docs/R3-SIGNALEMENTS-AUDIT.md"
      - ".github/workflows/r3-signalements-functional-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functional-contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Node 24.21
        uses: actions/setup-node@v5
        with:
          node-version: "24.21.0"

      - name: R3 Signalements contract — functional first, CSS forbidden while red
        shell: pwsh
        run: node scripts/r3-signalements-gate.mjs

  packaged-e2e:
    needs: functional-contract
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node 24.21
        uses: actions/setup-node@v5
        with:
          node-version: "24.21.0"

      - name: Install pinned desktop toolchain
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Build true unpacked Windows application
        shell: pwsh
        run: npm run dist:win:dir

      - name: Seed isolated profile and execute packaged journeys R3 + R4 including restore restart
        shell: pwsh
        run: |
          $local = Join-Path $env:RUNNER_TEMP "rdl-r3-e2e-localappdata"
          $evidence = Join-Path $env:RUNNER_TEMP "rdl-r3-e2e-evidence"
          Remove-Item $local -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $evidence -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $local -Force | Out-Null
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null

          node scripts/r3-seed-packaged-e2e.cjs $local $evidence
          if ($LASTEXITCODE -ne 0) { throw "Création de la fixture R3 impossible." }
          $fixture = Get-Content (Join-Path $evidence "fixture.json") -Raw | ConvertFrom-Json

          $exe = Get-ChildItem -Path dist -Recurse -Filter "Respect des Lieux PRO.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "Exécutable unpacked introuvable." }

          $r4Backup = Join-Path $local "r4-e2e-backup.rdlbackup"
          $r4Review = Join-Path $local "r4-e2e-review.json"
          $env:LOCALAPPDATA = $local
          $env:RDL_R3_E2E_PHOTO_PATH = [string]$fixture.fixturePhoto
          $env:RDL_R4_E2E_BACKUP_PATH = $r4Backup
          $env:RDL_R4_E2E_REVIEW_PATH = $r4Review
          Remove-Item Env:RDL_PACKAGED_SMOKE -ErrorAction SilentlyContinue

          $stdout = Join-Path $evidence "electron-stdout.txt"
          $stderr = Join-Path $evidence "electron-stderr.txt"
          $restartStdout = Join-Path $evidence "electron-restart-stdout.txt"
          $restartStderr = Join-Path $evidence "electron-restart-stderr.txt"
          $port = 9444
          $restartPort = 9445
          $p = $null
          $p2 = $null

          try {
            $p = Start-Process -FilePath $exe.FullName -ArgumentList "--remote-debugging-port=$port" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr

            node scripts/r3-packaged-e2e-v2.mjs --port $port --out $evidence --fixture (Join-Path $evidence "fixture.json")
            if ($LASTEXITCODE -ne 0) { throw "Le parcours E2E R3 Signalements a échoué (code $LASTEXITCODE)." }

            node scripts/r3-reparations-packaged-e2e.mjs --port $port --out $evidence --fixture (Join-Path $evidence "fixture.json")
            if ($LASTEXITCODE -ne 0) { throw "Le parcours E2E R3 Réparations a échoué (code $LASTEXITCODE)." }

            node scripts/r4-admin-packaged-e2e.mjs --port $port --out $evidence --local $local --backup $r4Backup --review $r4Review
            if ($LASTEXITCODE -ne 0) { throw "Le parcours E2E R4 administratif a échoué (code $LASTEXITCODE)." }

            node scripts/r4-admin-ux-packaged-e2e.mjs --port $port --out $evidence
            if ($LASTEXITCODE -ne 0) { throw "Le parcours visuel/accessibilité R4 administratif a échoué (code $LASTEXITCODE)." }

            if (-not (Select-String -Path $stdout -SimpleMatch "RDL_R3_E2E_DIALOG_ADAPTER_ENABLED" -Quiet)) {
              throw "L’adaptateur E2E du dialogue photo n’a pas été activé dans le vrai binaire empaqueté."
            }
            if (-not (Select-String -Path $stdout -SimpleMatch "RDL_R4_E2E_DIALOG_ADAPTER_ENABLED" -Quiet)) {
              throw "L’adaptateur E2E R4 des dialogues natifs n’a pas été activé dans le vrai binaire empaqueté."
            }

            if ($p -and -not $p.HasExited) {
              Stop-Process -Id $p.Id -Force
              Wait-Process -Id $p.Id -ErrorAction SilentlyContinue
            }
            Start-Sleep -Milliseconds 750

            $p2 = Start-Process -FilePath $exe.FullName -ArgumentList "--remote-debugging-port=$restartPort" -PassThru -RedirectStandardOutput $restartStdout -RedirectStandardError $restartStderr
            node scripts/r4-restore-restart-verify.mjs --port $restartPort --out $evidence --local $local
            if ($LASTEXITCODE -ne 0) { throw "La vérification R4 après redémarrage/restauration a échoué (code $LASTEXITCODE)." }
          }
          finally {
            if ($p -and -not $p.HasExited) {
              try { Stop-Process -Id $p.Id -Force } catch {}
            }
            if ($p2 -and -not $p2.HasExited) {
              try { Stop-Process -Id $p2.Id -Force } catch {}
            }
            Remove-Item Env:RDL_R3_E2E_PHOTO_PATH -ErrorAction SilentlyContinue
            Remove-Item Env:RDL_R4_E2E_BACKUP_PATH -ErrorAction SilentlyContinue
            Remove-Item Env:RDL_R4_E2E_REVIEW_PATH -ErrorAction SilentlyContinue
          }

      - name: Upload packaged E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-r4-packaged-e2e
          path: ${{ runner.temp }}/rdl-r3-e2e-evidence/**
          if-no-files-found: warn
          retention-days: 14
