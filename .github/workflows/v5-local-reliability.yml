name: V5 Local Reliability Gate

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  local-reliability:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node 24.21
        uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Runtime
        shell: pwsh
        run: node --version

      - name: R1 syntax, architecture, privacy and reliability gates
        shell: pwsh
        run: npm run verify