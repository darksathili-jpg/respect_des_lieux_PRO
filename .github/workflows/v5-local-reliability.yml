name: V5 Local Reliability Gate

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  local-reliability:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Runtime
        shell: pwsh
        run: node --version

      - name: Syntax guard
        shell: pwsh
        run: |
          node --check main.cjs
          node --check preload.cjs
          node --check src/database.cjs
          node --check src/storage.cjs
          node --check src/portable-backup.cjs
          node --check renderer/app.js

      - name: Local database, privacy and security tests
        shell: pwsh
        run: node --test tests/*.test.mjs
