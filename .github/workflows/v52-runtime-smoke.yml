name: V5.2 Packaged Windows Runtime Smoke

on:
  push:
    branches: ["main"]
    paths:
      - "package.json"
      - "main-entry.cjs"
      - "main-bootstrap.cjs"
      - "main.cjs"
      - "preload.cjs"
      - "src/**"
      - "renderer/**"
      - "scripts/capture-packaged-ui.mjs"
      - ".github/workflows/v52-runtime-smoke.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "package.json"
      - "main-entry.cjs"
      - "main-bootstrap.cjs"
      - "main.cjs"
      - "preload.cjs"
      - "src/**"
      - "renderer/**"
      - "scripts/capture-packaged-ui.mjs"
      - ".github/workflows/v52-runtime-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaged-runtime-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node 24.21
        uses: actions/setup-node@v5
        with:
          node-version: "24.21.0"

      - name: Install toolchain
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Verify R1 contracts before packaging
        shell: pwsh
        run: npm run verify

      - name: Build unpacked Windows application
        shell: pwsh
        run: npx electron-builder --win dir --x64 --publish never

      - name: Inspect packaged ASAR contents
        shell: pwsh
        run: |
          $asar = Join-Path $PWD "dist\win-unpacked\resources\app.asar"
          if (-not (Test-Path $asar)) { throw "app.asar absent du package." }
          @'
          const asar = require('@electron/asar');
          const path = require('node:path');
          const archive = path.resolve('dist/win-unpacked/resources/app.asar');
          const files = asar.listPackage(archive).map((p) => p.replace(/^[/\\]+/, '').replace(/\\/g, '/'));
          console.log('--- ASAR CONTENTS ---');
          console.log(files.join('\n'));
          const required = [
            'package.json',
            'main-entry.cjs',
            'main-bootstrap.cjs',
            'main.cjs',
            'preload.cjs',
            'renderer/index.html',
            'renderer/styles.css',
            'renderer/v51.css',
            'renderer/app.js',
            'renderer/detail.js',
            'renderer/detail.css',
            'src/database.cjs',
            'src/reparation-edit-extension.cjs',
            'src/storage.cjs',
            'src/portable-backup.cjs'
          ];
          const forbidden = [
            'renderer/dashboard-vf.css',
            'renderer/assets/dashboard-hero-master.webp',
            'renderer/assets/sidebar-logo-master.webp',
            'design/reference/dashboard-master.png',
            'quality/ui-contract.json',
            'scripts/quality-contract.mjs',
            'scripts/capture-packaged-ui.mjs'
          ];
          const missing = required.filter((p) => !files.includes(p));
          const leaked = forbidden.filter((p) => files.includes(p));
          if (missing.length) {
            console.error('ASAR_MISSING ' + JSON.stringify(missing));
            process.exit(73);
          }
          if (leaked.length) {
            console.error('ASAR_FORBIDDEN ' + JSON.stringify(leaked));
            process.exit(74);
          }
          console.log('ASAR_R1_CONTRACT_PASS');
          '@ | Set-Content -Path inspect-asar.cjs -Encoding utf8
          node inspect-asar.cjs

      - name: Verify packaged DOM, six-view navigation and real painted UI
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Recurse -Filter "Respect des Lieux PRO.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "Exécutable unpacked introuvable." }

          Write-Host "Launching real single-shell smoke probe: $($exe.FullName)"
          $stdout = Join-Path $env:RUNNER_TEMP "rdl-stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "rdl-stderr.txt"
          $env:RDL_PACKAGED_SMOKE = "1"

          $p = Start-Process -FilePath $exe.FullName -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $finished = $p.WaitForExit(25000)
          if (-not $finished) {
            try { Stop-Process -Id $p.Id -Force } catch {}
            if (Test-Path $stdout) { Write-Host "--- STDOUT ---"; Get-Content $stdout -Raw }
            if (Test-Path $stderr) { Write-Host "--- STDERR ---"; Get-Content $stderr -Raw }
            throw "Le contrôle de rendu n'a pas terminé dans le délai imparti."
          }

          $p.Refresh()
          $out = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { "" }
          $err = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "" }
          Write-Host "--- STDOUT ---"
          Write-Host $out
          Write-Host "--- STDERR ---"
          Write-Host $err

          if ($p.ExitCode -ne 0) {
            Write-Host "--- Recent Windows Application errors ---"
            Get-WinEvent -FilterHashtable @{LogName='Application'; Level=2; StartTime=(Get-Date).AddMinutes(-5)} -ErrorAction SilentlyContinue | Select-Object -First 12 | Format-List TimeCreated,ProviderName,Id,Message
            throw "L'application empaquetée a échoué au contrôle R1 (code $($p.ExitCode))."
          }
          if ($out -notmatch 'RDL_SMOKE_PASS') {
            throw "L'application s'est arrêtée sans preuve de shell unique rendue et navigable."
          }

          Write-Host "Packaged single-shell DOM + navigation + painted UI smoke: PASS"

      - name: Capture true packaged Accueil R2 visual evidence
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Recurse -Filter "Respect des Lieux PRO.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "Exécutable unpacked introuvable pour la preuve visuelle." }

          Remove-Item Env:RDL_PACKAGED_SMOKE -ErrorAction SilentlyContinue
          $port = 9333
          $evidence = Join-Path $env:RUNNER_TEMP "rdl-visual-evidence"
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          Write-Host "Launching real packaged renderer for visual evidence: $($exe.FullName)"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--remote-debugging-port=$port" -PassThru
          try {
            node scripts/capture-packaged-ui.mjs --port $port --out $evidence
            if ($LASTEXITCODE -ne 0) { throw "Le harnais de preuve visuelle a échoué (code $LASTEXITCODE)." }
            $required = @(
              (Join-Path $evidence "home-desktop-1440x900.png"),
              (Join-Path $evidence "home-desktop-keyboard-focus.png"),
              (Join-Path $evidence "home-reduced-1024x720.png"),
              (Join-Path $evidence "visual-evidence.json")
            )
            foreach ($file in $required) {
              if (-not (Test-Path $file)) { throw "Preuve visuelle absente: $file" }
            }
            Write-Host "True packaged Accueil R2 visual evidence: PASS"
          }
          finally {
            if ($p -and -not $p.HasExited) {
              try { Stop-Process -Id $p.Id -Force } catch {}
            }
          }

      - name: Upload packaged runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-runtime-evidence
          path: |
            ${{ runner.temp }}/rdl-stdout.txt
            ${{ runner.temp }}/rdl-stderr.txt
            ${{ runner.temp }}/rdl-visual-evidence/**
          if-no-files-found: ignore
          retention-days: 14
