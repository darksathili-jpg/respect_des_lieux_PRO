name: Electron Fidelity Integration Gate

on:
  push:
    branches: ["main"]
    paths:
      - "renderer/**"
      - "preload.cjs"
      - "main.cjs"
      - "main-bootstrap.cjs"
      - "package.json"
      - "design/reference/dashboard-master.png"
      - "design/visual/electron-dashboard.spec.mjs"
      - "design/visual/playwright.electron.config.mjs"
      - "design/visual/package.json"
      - "tests/**"
      - ".github/workflows/electron-fidelity-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  electron-fidelity:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node 24.21
        uses: actions/setup-node@v5
        with:
          node-version: "24.21.0"
          package-manager-cache: false

      - name: Verify approved master identity
        shell: pwsh
        run: |
          $master = "design/reference/dashboard-master.png"
          if (-not (Test-Path $master)) { throw "Master visuel absent: $master" }
          $hash = (Get-FileHash $master -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "1106a0bcbc52d34ef6ea95f56ac999b2abc228034bd1a673023d3c761f155944"
          Write-Host "dashboard-master.png SHA-256: $hash"
          if ($hash -ne $expected) { throw "La source de vérité visuelle a changé sans validation explicite." }

      - name: Install application dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Verify local foundation and renderer
        shell: pwsh
        run: npm run verify

      - name: Build packaged Windows directory
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win:dir

      - name: Install pinned Playwright harness
        shell: pwsh
        working-directory: design/visual
        run: npm install --no-audit --no-fund

      - name: Prepare immutable Electron snapshot baseline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "design/visual/electron-snapshots" | Out-Null
          Copy-Item "design/reference/dashboard-master.png" "design/visual/electron-snapshots/dashboard-master.png" -Force

      - name: Compare packaged Electron dashboard to master
        shell: pwsh
        working-directory: design/visual
        run: npx playwright test --config=playwright.electron.config.mjs

      - name: Upload Electron visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-fidelity-evidence
          path: |
            design/visual/electron-artifacts/**
            design/visual/playwright-report/**
          if-no-files-found: ignore
          retention-days: 14
