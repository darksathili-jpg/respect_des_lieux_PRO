<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Illustration du lycée Watteau</title>
  <desc id="desc">Illustration architecturale stylisée de la façade et de la tour du lycée Watteau à Valenciennes.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff8ef"/><stop offset="1" stop-color="#f2e6da"/></linearGradient>
    <linearGradient id="brick" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c95543"/><stop offset="1" stop-color="#a9342f"/></linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2d3bd"/><stop offset="1" stop-color="#d58a70"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#63201d" flood-opacity=".16"/></filter>
  </defs>
  <rect width="900" height="420" rx="34" fill="url(#sky)"/>
  <circle cx="125" cy="86" r="86" fill="#dceaf0" opacity=".72"/>
  <circle cx="790" cy="78" r="104" fill="#ead9cd" opacity=".7"/>
  <path d="M0 334C106 292 202 305 289 326c105 25 213 17 311-12 108-31 208-26 300 4v102H0Z" fill="#e8d6c7" opacity=".8"/>

